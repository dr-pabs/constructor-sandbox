# Constructor's environment for this repository (based on
# examples/env/claude-python.env.yaml in the Constructor repository).
base_image: mcr.microsoft.com/devcontainers/python:3.12
setup:
  - pip install -r requirements-dev.txt
lockfiles: [requirements-dev.txt]
test_command: pytest -q
harness: claude-code@2
network:
  allow: [api.anthropic.com, pypi.org, files.pythonhosted.org, github.com]
secrets: [ANTHROPIC_API_KEY]
resources: {cpu: 2, memory_gb: 4, disk_gb: 20, max_minutes: 90}
